<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Private Library · Michel Johnson</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./private.css?v=admin-menu-v1-20260909">
  </head>
  <body class="private-body">
    <main class="private-shell">
      <div class="paper-noise" aria-hidden="true"></div>

      <nav class="site-nav private-nav" aria-label="Private navigation">
        <a class="brand-lockup" href="./?home=1" aria-label="Michel Johnson home">
          <span class="brand-dot"></span>
          <span>Michel Johnson</span>
        </a>
        <div class="nav-links">
          <details class="private-admin-menu">
            <summary>后台</summary>
            <nav class="private-admin-menu-panel" aria-label="后台工具">
              <a href="/api/admin/traffic-page">访问统计</a>
              <a href="/api/admin/traffic-page#addresses">访客 IP</a>
              <a href="./admin.html?drafts=1">文章后台</a>
            </nav>
          </details>
        </div>
      </nav>

      <section class="private-login" data-login-panel aria-labelledby="private-login-title">
        <form class="private-login-form" data-login-form>
          <p class="private-eyebrow">Owner access</p>
          <h1 id="private-login-title">Unlock private library</h1>
          <p>Private writing stays behind the server session.</p>
          <label>
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" required autofocus>
          </label>
          <button type="submit">Unlock</button>
          <p class="private-error" data-login-error role="alert" hidden></p>
        </form>
      </section>

      <section class="private-workspace" data-private-workspace hidden aria-labelledby="private-title">
        <header class="private-heading">
          <div>
            <p class="private-eyebrow">Private</p>
            <h1 id="private-title">Michel's library</h1>
          </div>
          <a class="private-new" href="./admin.html?new=1">New paper</a>
        </header>

        <section class="private-section private-books-section" aria-labelledby="private-books-title">
          <div class="private-section-heading">
            <div>
              <p class="private-section-index">01</p>
              <h2 id="private-books-title">Private writing</h2>
            </div>
            <p data-published-count>0 volumes</p>
          </div>
          <p class="private-empty" data-published-empty hidden>No private drafts yet. Public articles appear on the Blog page.</p>
          <p data-books-loading hidden role="status">Loading library…</p>
          <div data-private-bookcase aria-label="Private writing bookshelf"></div>
          <nav class="private-book-links" data-book-links aria-label="Edit private writing"></nav>
        </section>


      </section>
    </main>

    <script src="./private.js?v=automatic-lock-clean-nav-v3-20260910" defer></script>
  </body>
</html>
